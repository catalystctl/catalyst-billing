            responses:
                2XX:
                    description: Back to the operator's own identity
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: This session is not an impersonation
                "401":
                    content:
                        application/json:
                            schema:
