            description: 'A PUT because the screen submits the whole set. Every entry is validated before any is written, so a request that turns three events off and fails on the fourth does not leave the account half-configured. `choice_off` and `never` against a force event (password reset, email verification) are refused with 422 `force_event`: opting out of the reset mail does not protect anyone, it makes the account unrecoverable.'
