components:
    schemas:
        Amount:
            properties:
                currency:
                    pattern: ^[A-Z0-9]{2,12}$
                    type: string
                display:
                    type: string
                minor:
                    format: int64
                    type: integer
                scale:
                    type: integer
            required:
                - minor
                - currency
                - scale
            type: object
        Operation:
            properties:
                attempts:
                    type: integer
                id:
                    format: uuid
                    type: string
                kind:
                    type: string
                last_error:
                    type: string
                lease_expires_at:
                    format: date-time
                    type:
                        - string
                        - "null"
                status:
                    type: string
                status_url:
                    type: string
            type: object
        Problem:
            properties:
                code:
                    description: stable machine code
                    type: string
                detail:
                    type: string
                status:
                    type: integer
                title:
                    type: string
                type:
                    type: string
            required:
                - type
                - title
                - status
                - code
            type: object
    securitySchemes:
        bearerKey:
            description: An API key. It can only narrow its owner's permissions, never widen them.
            scheme: bearer
            type: http
        sessionCookie:
            description: Server-side session; the CSRF cookie must be echoed in X-CSRF-Token on mutations.
            in: cookie
            name: billing_session
            type: apiKey
info:
    description: |-
        A self-hosted billing panel for hosting providers.

        Conventions:
        * Money is always integer minor units plus an explicit currency; never a float, never a decimal string in a request body.
        * Errors are application/problem+json with a stable `code`.
        * Lists are keyset-paginated: `limit` (default 25, max 100) and an opaque `cursor`.
        * Mutations accept `Idempotency-Key`; money actions require it. A replay with the same body returns the stored response; a replay with a different body is 422.
        * A long action answers 202 with `{operation_id, status_url}` rather than holding the connection open.
    title: Catalyst Billing API
    version: 1.0.0
openapi: 3.1.0
