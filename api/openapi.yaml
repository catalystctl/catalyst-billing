                    description: An internal error occurred
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: No payment gateway is configured, or the gateway is unavailable
            security:
                - sessionCookie: []
                - bearerKey: []
            summary: Start a credit top-up through the gateway
            x-csrf-required: true
            x-idempotency:
