    /api/v1/portal/credits/deposit:
        post:
            description: 'Creates a deposit invoice and opens a gateway session, then returns the redirect URL. The amount is validated against `credits.enabled`, `credits.minimum_deposit_minor`, `credits.maximum_deposit_minor` and `credits.maximum_credit_minor` *before* anything is created, so a refused top-up leaves no open invoice behind, and an unsettled deposit already started counts against the maximum so two top-ups cannot both pass the limit. A deposit is an ordinary invoice carrying `snapshot.catalyst_deposit = "credit"` and no order: the gateway path, its recorded attempt and its amount verification are the existing ones, unchanged, and the operator dashboard''s paid-not-provisioned check does not mistake it for an undelivered purchase. The credit is granted when the settled webhook arrives, not when this call returns.'
            operationId: PostPortalCreditsDeposit
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                amount_minor:
                                    format: int64
                                    minimum: 1
                                    type: integer
                                currency:
                                    pattern: ^[A-Z0-9]{2,12}$
                                    type: string
                            required:
                                - amount_minor
                                - currency
                            type: object
                required: true
            responses:
                2XX:
                    description: A deposit invoice and the gateway redirect
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: The amount is outside the configured deposit range
                "401":
                    content:
                        application/json:
                            schema:
