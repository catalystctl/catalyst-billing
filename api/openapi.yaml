    /api/v1/auth/password/change:
        post:
            description: |-
                For a signed-in user rotating a credential they still know. The current password is verified first, then the new one is hashed with the same Argon2id parameters the login path verifies with.

                Success revokes **every other session** and keeps the caller's own: a password change is what someone does when they suspect the old one leaked, so every other device must be signed out, while the device that just proved the password must not be. The response reports how many sessions were revoked.

                A wrong current password is `401 invalid_credentials` (safe to say: the caller already holds a session). A new password outside the length bounds is `422 weak_password`. An `auth_events` row records the change, attributed to the account itself.
            operationId: PostAuthPasswordChange
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                current_password:
                                    type: string
                                new_password:
                                    maxLength: 1024
                                    minLength: 12
                                    type: string
                            required:
                                - current_password
                                - new_password
                            type: object
                required: true
            responses:
                2XX:
                    content:
                        application/json:
                            schema:
                                properties:
                                    sessions_revoked:
                                        minimum: 0
                                        type: integer
                                    status:
                                        enum:
                                            - password_changed
                                        type: string
                                required:
                                    - status
                                    - sessions_revoked
                                type: object
                    description: The password was changed and other sessions were revoked
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: A password was not supplied
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: The current password is wrong
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: The caller lacks the permission, or the CSRF token is missing
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: No such record
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: The new password is too weak
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: The request budget for this route class is exhausted
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: An internal error occurred
            security:
                - sessionCookie: []
                - bearerKey: []
            summary: Change your own password
            x-csrf-required: true
            x-rate-class: mutation
    /api/v1/auth/register:
        post:
            description: |-
                Self-registration: one transaction creates the login, the billing account and the link between them, then queues the email-verification message.

                **The response never says whether the address was already registered.** It is always `202` with `{status: "accepted", verification_required}`. A duplicate still queues a verification message to the existing account (which is useful and indistinguishable from the fresh case), and the password is hashed before the insert is attempted so the timing matches too. A client must therefore never branch on this response to tell the two apart — and must not treat it as a sign-in: no session cookie is set. Send the visitor to sign in with the credentials they chose, or to their mail when `verification_required` is true.

                Refusals are only for things the caller can fix: a malformed address (`400 invalid_email`), a missing name (`400 invalid_display_name`), a weak password (`422 weak_password`), terms not accepted when the installation has terms (`422 tos_required`), and a closed registration (`403 registration_disabled`).

                Rate limited per source address and per submitted address with the credential budget, and same-origin enforced. CSRF does not apply: there is no session to bind a token to.
            operationId: PostAuthRegister
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                accept_tos:
                                    default: false
                                    description: Required only when the installation has terms configured.
                                    type: boolean
                                display_name:
                                    maxLength: 200
                                    minLength: 1
                                    type: string
                                email:
                                    format: email
                                    maxLength: 254
                                    type: string
                                password:
                                    maxLength: 1024
                                    minLength: 12
                                    type: string
                            required:
                                - email
                                - password
                                - display_name
                            type: object
                required: true
            responses:
                2XX:
                    content:
                        application/json:
                            schema:
                                properties:
                                    status:
                                        enum:
                                            - accepted
                                        type: string
                                    verification_required:
                                        description: The installation requires a confirmed address before signing in. This is policy, not a fact about the submitted address.
                                        type: boolean
                                required:
                                    - status
                                    - verification_required
                                type: object
                    description: Accepted (whether the account was created or the address already existed)
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: The address or the display name is unusable
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: Registration is closed, or the request was cross-origin
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: No such record
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: The password is too weak, or terms were not accepted
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: The request budget for this route class is exhausted
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Problem'
                    description: An internal error occurred
            summary: Create a customer account
            x-rate-class: ""
