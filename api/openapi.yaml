        post:
            description: 'Ends the borrowed session and rotates the operator''s own session token back into the cookie. Rotation is deliberate: the impersonated token was in a browser that may have been shared, and a token that outlives the impersonation is the one thing that must not happen. If the operator''s own session ended meanwhile, the cookie is cleared and the answer is 401 rather than a session that looks alive.'
