    /api/v1/staff/dashboard:
        get:
            description: 'Revenue from the ledger (the revenue account, credits minus debits) so a credit note reduces it and a void invoice never counted; invoice counts by status; active customers; the open ticket count; normalised monthly recurring revenue from subscriptions; and the exception count from the operator overview. Every money figure is a list per currency — there is no cross-currency total, because adding currencies would be arithmetic on unrelated quantities. `available: false` means a figure could not be read; it is not the same as zero.'
            operationId: GetStaffDashboard
            responses:
                2XX:
                    content:
                        application/json:
                            schema:
                                properties:
                                    active_customers:
                                        description: Customers with a live service or an invoice in the period.
                                        type: integer
                                    available:
                                        description: False when a figure could not be read. Reporting zero instead would make a broken database look like an empty business.
                                        type: boolean
                                    exception_critical:
                                        type: integer
                                    exceptions:
                                        description: The exception count from the operator overview, so the dashboard does not have to fetch it twice.
                                        type: integer
                                    from:
                                        format: date-time
                                        type: string
                                    generated_at:
                                        format: date-time
                                        type: string
                                    invoices:
                                        description: Invoice counts by status, for invoices issued in the period.
                                        items:
                                            properties:
                                                count:
                                                    type: integer
                                                status:
                                                    type: string
                                            required:
                                                - status
                                                - count
                                            type: object
                                        type: array
                                    open_tickets:
                                        description: The support queue depth right now.
                                        type: integer
                                    period:
                                        enum:
