<!DOCTYPE html>
<html lang="en" data-theme="{{THEME_COLOR_SCHEME}}" data-shell="{{THEME_NAV}}" data-density="{{THEME_DENSITY}}" data-card-variant="{{THEME_CARD_STYLE}}" data-table-variant="{{THEME_TABLE_STYLE}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="{{THEME_DESCRIPTION}}" />
    <title>{{THEME_TITLE}}</title>
    <!--
      The brand. The mark, the icons and the manifest come from assets/brand, which is
      generated by scripts/brand/build.py from the parent Catalyst logo and the site's own
      palette — so the tab icon and the social card cannot drift from catalystctl.com.

      Every value below is a theme placeholder. web/web.go substitutes them from the published
      theme (or from its built-in default, which is what an installation with no theme gets), and
      web/build.mjs leaves an unknown placeholder alone so `go build` works with no Node
      toolchain. Substituting on the server rather than in the browser is what lets an operator
      replace the social card without a rebuild: the bytes the crawler fetches are the ones the
      server rendered.
    -->
    <link rel="icon" href="{{THEME_FAVICON_SVG}}" type="image/svg+xml" />
    <link rel="icon" href="{{THEME_FAVICON_PNG}}" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="{{THEME_APPLE_ICON}}" />
    <link rel="manifest" href="{{THEME_MANIFEST}}" />
    <meta name="theme-color" content="{{THEME_COLOR}}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{THEME_SITE_NAME}}" />
    <meta property="og:title" content="{{THEME_TITLE}}" />
    <meta property="og:description" content="{{THEME_DESCRIPTION}}" />
    <meta property="og:image" content="{{THEME_OG_IMAGE}}" />
    <meta property="og:image:width" content="{{THEME_OG_W}}" />
    <meta property="og:image:height" content="{{THEME_OG_H}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="{{THEME_OG_IMAGE}}" />
    <!--
      The boot script. It is a classic script in <head>, so it runs before the first paint: it
      reads the stored light/dark choice and sets data-theme, which is why a returning user does
      not see the theme's default mode flash for one frame. It is a file and not an inline script
      because the Content-Security-Policy is `script-src 'self'` with no 'unsafe-inline', and
      widening it for a colour preference would be the wrong trade.
    -->
    {{THEME_BOOT_SCRIPT}}
    <link rel="stylesheet" href="/assets/app.4b3175bf3b6a.css" />
    <!--
      The theme stylesheet, when a theme is published. It is a second <link> after the bundled
      one, so its `:root` and `[data-theme="light"]` declarations win on source order at equal
      specificity — which is how a published theme overrides the built-in tokens without either
      file knowing about the other. It is revision-addressed, so it is cached immutably and a
      publish is visible on the next navigation with no cache purge.
    -->
    {{THEME_CSS_LINK}}
    <!--
      The shell. It contains no inline script and no inline style: the Content-Security-Policy
      forbids both, and a shell that needed an exemption would be the wrong shell.

      The theme is applied before first paint by the boot script above; the data-theme attribute
      here is only the default for a cold visit, so the page never flashes the wrong background.
    -->
  </head>
  <body>
    <div id="root" class="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-mark" aria-hidden="true">
          <!-- The parent's mark, inlined so the first paint needs no request. Kept in sync
               with assets/brand/logo-mark.svg by scripts/brand/build.py, and replaceable by a
               theme's uploaded mark. -->
          {{THEME_MARK}}
        </div>
        <p class="boot-text">Opening the ledger…</p>
      </div>
    </div>
    <noscript>
      <div class="noscript">
        <h1>JavaScript is required</h1>
        <p>
          This panel is a client for the billing API, and it renders everything in the browser.
          Enable JavaScript, or use the API directly at <code>/api/v1</code>.
        </p>
      </div>
    </noscript>
    <script src="/assets/app.aff663f2deee.js" type="module"></script>
  </body>
</html>
